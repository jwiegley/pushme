Name:     'src'
Priority: 50
Classes:
  - 'small'

Stores:
  hera:
    Path: $home/src
    ReceiveFrom:
      - clio
    ExtraFilters: |
      - /ledger/
      - /stock-trader/

  clio:
    Path: $home/src
    ReceiveFrom:
      - hera

  tank:
    Path: $tank/src
    PreserveXattrs: false
    ReceiveFrom:
      - hera
      - clio

Common:
  PreserveAttrs: true
  PreserveCrtimes: false
  Filters: $srcFilters
