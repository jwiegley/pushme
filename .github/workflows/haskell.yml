name: Haskell CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: haskell-actions/setup@v2
      with:
        ghc-version: '9.10'
        cabal-version: '3.10'

    - name: Cache
      uses: actions/cache@v4
      env:
        cache-name: cache-cabal
      with:
        path: ~/.cabal
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('**/cabal.project') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-build-
          ${{ runner.os }}-

    - name: Install dependencies
      run: |
        cabal update
        cabal build --only-dependencies --enable-tests --enable-benchmarks

    - name: Build (warnings as errors)
      run: cabal build --enable-tests --enable-benchmarks --ghc-options=-Werror all

    - name: Run tests
      run: cabal test all

    - name: Test coverage
      continue-on-error: true
      run: |
        cabal test all --enable-coverage
        cabal exec -- hpc report dist-newstyle/build/*/ghc-*/pushme-*/t/pushme-tests/hpc/vanilla/tix/pushme-tests/pushme-tests.tix || true

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up HLint
      uses: haskell-actions/hlint-setup@v2

    - name: Run HLint
      uses: haskell-actions/hlint-run@v2
      with:
        path: '["Main.hs", "src/"]'
        fail-on: warning

  format:
    runs-on: ubuntu-latest

    # Pin the formatter. An unpinned `cabal install fourmolu` turns every
    # upstream release into a CI failure: 0.20.0.0 changed the layout of
    # `infixr 0` operator chains ($, seq) from a trailing "staircase" to
    # leading operators, which broke this job. 0.19.0.1 is the version in
    # nixpkgs, which is what lefthook and `nix flake check` run locally.
    env:
      FOURMOLU_VERSION: '0.19.0.1'

    steps:
    - uses: actions/checkout@v4

    - name: Install fourmolu
      run: |
        curl -fsSL -o "$RUNNER_TEMP/fourmolu" \
          "https://github.com/fourmolu/fourmolu/releases/download/v$FOURMOLU_VERSION/fourmolu-$FOURMOLU_VERSION-linux-x86_64"
        chmod +x "$RUNNER_TEMP/fourmolu"
        "$RUNNER_TEMP/fourmolu" --version
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

    - name: Check formatting
      run: |
        fourmolu --mode check Main.hs src/Pushme/Options.hs test/Main.hs
